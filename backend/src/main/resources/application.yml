spring:
  application:
    name: etra-cti
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/etra_cti
    username: etra
    password: etra_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          json_format_mapper: jackson
        format_sql: true
        jdbc:
          batch_size: 50
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

etra:
  jwt:
    secret: ${JWT_SECRET:eJG6Y/b1IZ6d0wWVOnjWGwXAEAiYqXDA0eetVAz06P7AMZfg1eQCxiMwAxFe844JZ5JjUFqZ8aX2hPimqdRwLg==}
    access-token-expiry: 900000
    refresh-token-expiry: 604800000
  cors:
    allowed-origins: http://localhost:3000
  evidence:
    storage-path: "${EVIDENCE_PATH:C:/dev/etra-cti/evidence}"
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.etra.cti: DEBUG
    com.etra.cti.detection: DEBUG
    com.etra.cti.event: DEBUG
    org.hibernate.SQL: DEBUG